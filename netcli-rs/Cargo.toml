[package]
name = "netcli"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# 0.52.1 includes upstream fix #1206 for prompt movement when terminal height
# reported by the TTY is too small or zero (common with serial consoles).
# Keep the completion menu to one row in main.rs to reduce serial-console repainting.
reedline = { version = "=0.52.1", default-features = false }

[features]
# Test-only hooks (NETCLI_UCI_CTL override, inherited PATH). Never enabled in
# release images.
test-hooks = []

[profile.release]
strip = true
lto = true
opt-level = "z"
panic = "abort"
